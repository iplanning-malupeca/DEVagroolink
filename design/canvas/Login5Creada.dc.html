<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login · Cuenta creada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;color:#0F2A1F}
a{color:#0B4A35;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 960px; height: 760px; background: #E6EAF0; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-modal="true" aria-labelledby="t5" style="width: 400px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; box-shadow: 0 20px 50px rgba(15, 30, 40, 0.16); padding: 24px 28px 26px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <img src="/_blob/efc8ad652a1438d78ae82dbb2369ee52" alt="Agroolink" style="height: 24px; width: auto; display: block;">
      <button type="button" aria-label="Cerrar" style="width: 32px; height: 32px; border: 0; background: none; color: #6B7A86; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <span style="width: 60px; height: 60px; border-radius: 50%; background: #E8F2EC; display: flex; align-items: center; justify-content: center; align-self: center;"><span style="width: 40px; height: 40px; border-radius: 50%; background: #0B4A35; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span></span>
    <div style="text-align: center; display: flex; flex-direction: column; gap: 6px;">
      <h1 id="t5" style="margin: 0; font-size: 21px; font-weight: 700;">¡Cuenta creada con éxito!</h1>
      <p style="margin: 0; font-size: 13px; color: #55636E; line-height: 1.5;">{{ sub }}</p>
    </div>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid #DCE9E1; background: #F2F7F4; border-radius: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B4A35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
      <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 700;">{{ boxTitle }}</span><span style="font-size: 12px; color: #55636E; line-height: 1.45;">{{ boxText }}</span></span>
    </div>
    <a href="#" style="height: 46px; border-radius: 10px; background: #0B4A35; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px;">{{ primary }} <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a href="#" style="font-size: 12.5px; text-align: center; text-decoration: underline;">{{ secondary }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variante":{"editor":"enum","options":["Solo para mí","Represento una empresa","Soy experto"],"default":"Solo para mí"},"$preview":{"width":960,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variante ?? 'Solo para mí';
    const map = {
      'Solo para mí': {
        sub: 'Ya puedes acceder a Agroolink y disfrutar de todas sus funcionalidades.',
        boxTitle: 'Ahora vuelve a la página donde estabas',
        boxText: 'Te hemos guardado tu acción para que puedas continuar.',
        primary: 'Volver a Agroolink',
        secondary: 'Ir a mi espacio'
      },
      'Represento una empresa': {
        sub: 'Tu perfil personal está listo. Ahora vamos con tu empresa.',
        boxTitle: 'Siguiente: busca Granja Los Olmos',
        boxText: 'Si ya está en Agroolink podrás reclamarla o unirte; si no, la creas en 2 minutos.',
        primary: 'Continuar con mi empresa',
        secondary: 'Hacerlo más tarde y volver a donde estaba'
      },
      'Soy experto': {
        sub: 'Tu perfil personal está listo. Ahora vamos con tu perfil de experto.',
        boxTitle: 'Siguiente: tu perfil de experto',
        boxText: 'Profesión, especialidades y zona. Son 3 pasos y puedes terminarlo después.',
        primary: 'Crear mi perfil de experto',
        secondary: 'Hacerlo más tarde y volver a donde estaba'
      }
    };
    return map[v] || map['Solo para mí'];
  }
}
</script>
</body>
</html>
