<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login · Crear cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;color:#0F2A1F}
a{color:#0F2A1F;font-weight:700}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700}
.inp{height:36px;border:1px solid #D3D9DE;border-radius:8px;padding:0 12px;font:400 13px 'Plus Jakarta Sans',sans-serif;color:#0F2A1F;background:#FFFFFF;width:100%;box-sizing:border-box}
.req{color:#D23C3C}
.li{display:flex;gap:10px;align-items:center;font-size:13px;color:#E3EEE7}
.ck{display:flex;gap:8px;align-items:center;font-size:12px;color:#33424C}
.ck input{accent-color:#0B4A35;width:15px;height:15px;margin:0}
</style>
</helmet>
<div style="width: 960px; height: 760px; background: #E6EAF0; display: flex; align-items: center; justify-content: center;">
  <div style="width: 860px; height: 610px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 20px 50px rgba(15, 30, 40, 0.14); display: flex; overflow: hidden;">
    <div style="width: 340px; flex: none; background: linear-gradient(160deg, #0B4A35, #062C20); padding: 32px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px; color: #FFFFFF;">
      <img src="/_blob/b56d03e5af838b746ec3789751ce90fa" alt="Agroolink" style="height: 28px; width: auto; display: block;">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3;">Conectando el campo con oportunidades</h2>
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <span class="li"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Accede a contenido técnico exclusivo</span>
        <span class="li"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Conecta con empresas y expertos</span>
        <span class="li"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Guarda productos y organiza tus proyectos</span>
        <span class="li"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Recibe novedades del sector</span>
      </div>
    </div>
    <form style="flex: 1; padding: 26px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; flex-direction: column; gap: 2px;"><h1 style="margin: 0; font-size: 22px; font-weight: 700;">Crear cuenta</h1><span style="font-size: 12px; color: #55636E;">Solo te llevará un minuto</span></div>
        <button type="button" style="border: 0; background: none; font: 700 12px 'Plus Jakarta Sans', sans-serif; color: #0F2A1F; display: flex; align-items: center; gap: 4px; cursor: pointer;">ES <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <label class="lbl"><span>Nombre <span class="req">*</span></span><input class="inp" type="text" value="Samuel Esteban"></label>
      <label class="lbl"><span>Empresa <span class="req">*</span></span><input class="inp" type="text" value="Granja Los Olmos"></label>
      <label class="lbl">Cargo<select class="inp"><option>Gerente / Propietario</option><option>Técnico</option><option>Veterinario</option><option>Comercial</option></select></label>
      <label class="lbl"><span>País <span class="req">*</span></span><select class="inp"><option>España</option></select></label>
      <label class="lbl">Idioma<select class="inp"><option>Español</option></select></label>
      <label class="ck"><input type="checkbox" defaultChecked="{{ yes }}"><span>Acepto los <a href="#">Términos y Condiciones</a> <span class="req">*</span></span></label>
      <label class="ck"><input type="checkbox" defaultChecked="{{ yes }}">Quiero recibir novedades de Agroolink</label>
      <button type="submit" style="height: 40px; border-radius: 8px; background: #0B4A35; color: #FFFFFF; border: 0; font: 700 13.5px 'Plus Jakarta Sans', sans-serif; cursor: pointer; margin-top: 4px;">Continuar</button>
      <span style="font-size: 12px; color: #33424C; text-align: center;">¿Ya tienes una cuenta? <a href="#" style="text-decoration: underline;">Inicia sesión</a></span>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
