<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Header · Personal con perfil de experto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.skel{background:#F1F3F1;border-radius:12px}
</style>
</helmet>
<div style="width: 1280px; height: 1060px; position: relative; overflow: hidden; background: #FFFFFF;">
  <main aria-hidden="true" style="position: absolute; top: 68px; left: 0; right: 0; padding: 32px 28px; display: flex; flex-direction: column; gap: 20px;">
    <div class="skel" style="height: 260px;"></div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;"><div class="skel" style="height: 220px;"></div><div class="skel" style="height: 220px;"></div><div class="skel" style="height: 220px;"></div><div class="skel" style="height: 220px;"></div></div>
  </main>
  <div style="position: absolute; top: 0; left: 0; width: 1280px;">
    <dc-import name="IntHeader" persona="Santiago E." iniciales="SE" color="#4B3BA6" variante="experta" abierto="{{ no }}" marcado="{{ yes }}" hint-size="1280px,68px"></dc-import>
  </div>
  <div style="position: absolute; top: 76px; right: 24px;">
    <dc-import name="AvatarMenu" variante="experto" persona="Santiago E." iniciales="SE" hint-size="400px,960px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1060}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, no: false }; }
}
</script>
</body>
</html>
