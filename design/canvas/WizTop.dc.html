<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Componente · Cabecera del asistente de empresa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 128px; font-family: 'Poppins', sans-serif; color: #17231D; background: #FFFFFF; border-bottom: 1px solid #E3E8E4;">
  <div style="height: 64px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 14px;">
    <img src="/_blob/efc8ad652a1438d78ae82dbb2369ee52" alt="Agroolink" style="height: 28px; width: auto; display: block;">
    <span style="font-size: 12px; font-weight: 600; color: #1D4E89; background: #E9F0F9; border-radius: 999px; padding: 3px 10px;">Empresas</span>
    <span style="font-size: 13.5px; color: #4A5650; margin-left: 8px;">Configurando <strong style="color: #17231D;">{{ empresa }}</strong></span>
    <a href="#" style="margin-left: auto; font-size: 13.5px; color: #4A5650; text-decoration: none;">Guardar y salir</a>
  </div>
  <ol aria-label="Pasos" style="list-style: none; margin: 0; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 8px;">
    <sc-for list="{{ pasos }}" as="p" hint-placeholder-count="7">
      <li aria-current="{{ p.current }}" style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
        <span style="width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: {{ p.fondo }}; color: {{ p.tinta }}; border: {{ p.borde }}; box-sizing: border-box;">{{ p.marca }}</span>
        <span style="font-size: 13px; font-weight: {{ p.peso }}; color: {{ p.color }}; white-space: nowrap;">{{ p.label }}</span>
        <span style="flex: 1; height: 2px; background: {{ p.linea }}; border-radius: 1px; min-width: 12px;"></span>
      </li>
    </sc-for>
  </ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paso":{"editor":"int","default":3,"min":1,"max":7},"empresa":{"editor":"text","default":"Zucami Poultry Equipment"},"$preview":{"width":1280,"height":128}}'>
class Component extends DCLogic {
  renderVals() {
    const n = this.props.paso ?? 3;
    const labels = ['Empresa', 'Verificación', 'Tipo de empresa', 'Perfil', 'Red comercial', 'Contacto', 'Productos'];
    const pasos = labels.map((l, i) => {
      const k = i + 1, hecho = k < n, actual = k === n;
      return {
        label: l, marca: hecho ? '✓' : String(k), current: actual ? 'step' : 'false',
        fondo: hecho ? '#1D4E89' : (actual ? '#E9F0F9' : '#FFFFFF'),
        tinta: hecho ? '#FFFFFF' : (actual ? '#1D4E89' : '#8A948F'),
        borde: hecho ? '0' : (actual ? '2px solid #1D4E89' : '1.5px solid #CFD8D2'),
        peso: actual ? '600' : '400', color: (hecho || actual) ? '#17231D' : '#8A948F',
        linea: hecho ? '#1D4E89' : '#E3E8E4'
      };
    });
    pasos[pasos.length - 1].linea = 'transparent';
    return { pasos: pasos, empresa: this.props.empresa ?? 'Zucami Poultry Equipment' };
  }
}
</script>
</body>
</html>
