<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agroolink · Nuevo proyecto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior fija + una pregunta por pantalla en columna central (máx. 680 px) */
:root{
  --bg:#FFFFFF; --bg2:#F6F8F6; --fg:#17231D; --muted:#56615B; --line:#E3E8E4; --line2:#D5DED8;
  --accent:#0E5A3A; --accent-ink:#FFFFFF; --soft:#EEF6EE; --soft2:#DDF0D8; --lime:#B5D334; --lila:#4B3BA6; --lila-soft:#F1EEFB;
  --warn-bg:#FFF4E0; --warn:#7A4B00; --danger:#A3271B;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --bg2:#141E19; --fg:#E7EEE9; --muted:#9AA8A0; --line:#26332C; --line2:#33443A;
  --accent:#5FBF8C; --accent-ink:#0B1F15; --soft:#183326; --soft2:#1E4030; --lime:#C6E05A; --lila:#B3A7F2; --lila-soft:#272246;
  --warn-bg:#3A2E12; --warn:#F2C46B; --danger:#F08A7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1713; --bg2:#141E19; --fg:#E7EEE9; --muted:#9AA8A0; --line:#26332C; --line2:#33443A;
  --accent:#5FBF8C; --accent-ink:#0B1F15; --soft:#183326; --soft2:#1E4030; --lime:#C6E05A; --lila:#B3A7F2; --lila-soft:#272246;
  --warn-bg:#3A2E12; --warn:#F2C46B; --danger:#F08A7E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.3px;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{font-style:normal;color:var(--fg)}
.logo b{width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.saved{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saved .d{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.link{background:none;border:0;color:var(--accent);font-weight:500;cursor:pointer;padding:6px 8px;border-radius:8px;white-space:nowrap}
.link:hover{background:var(--soft)}
.prog{height:4px;background:var(--line)}
.prog span{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.stage{flex:1;display:flex;justify-content:center;padding:clamp(28px,6vh,72px) 16px 32px}
.q{width:100%;max-width:680px;display:flex;flex-direction:column;gap:20px}
.q.enter{animation:in .32s ease both}
@keyframes in{from{opacity:.55;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.q.enter{animation:none}.prog span{transition:none}}
.qnum{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.04em;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.qnum .sec{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
h1.t{margin:0;font-size:clamp(23px,3.4vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.req{color:var(--accent)}
.help{margin:-8px 0 0;color:var(--muted);font-size:14.5px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line2);border-radius:14px;background:var(--bg);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--accent)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.card .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.card[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}
.card .tt{font-weight:600;font-size:15px;display:block}
.card .dd{font-size:13px;color:var(--muted);display:block;line-height:1.4}
.key{font-size:11px;font-weight:600;border:1px solid var(--line2);border-radius:5px;padding:0 6px;color:var(--muted);margin-left:auto;flex:none;line-height:20px}
.card[aria-pressed="true"] .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line2);border-radius:12px;background:var(--bg);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:500}
.opt .key{margin-left:0}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border:1.5px solid var(--line2);border-radius:999px;background:var(--bg);cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.sub{min-height:32px;font-size:13px;padding:4px 12px}
.chip.sub[aria-pressed="true"]{background:var(--soft2);border-color:var(--soft2);color:var(--accent)}.chip.pt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
input.in,textarea.in,select.in{width:100%;border:0;border-bottom:2px solid var(--line2);background:transparent;padding:10px 2px;font-size:20px;outline:none}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--accent)}
textarea.in{font-size:16px;line-height:1.55;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;min-height:150px;resize:vertical}
textarea.in:focus{border-color:var(--accent)}
.box{border:1.5px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:15px;background:var(--bg);width:100%}
.box:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1 1 180px;min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.unit{display:flex;align-items:flex-end;gap:10px}
.unit span{font-size:15px;color:var(--muted);padding-bottom:12px;white-space:nowrap}
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{height:46px;padding:0 22px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line2);background:var(--bg);font-weight:500;cursor:pointer}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger)}
.sp{flex:1}
.tree{display:flex;flex-direction:column;gap:12px}
.branch{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.branch.on{border-color:var(--accent)}
.branch .hd{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;height:46px}
.search input{border:0;outline:none;background:transparent;flex:1;font-size:15px;min-width:0}
.list{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto;padding-right:4px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg);text-align:left;width:100%}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.pick .av{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#FFFFFF}
.pick small{display:block;color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.tag.l{background:var(--lila-soft);color:var(--lila)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--soft)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg2);font-size:13.5px}
.file button{margin-left:auto}
.combo{position:relative}.combo-btn{display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;min-height:46px}.combo-btn .fl{font-size:20px;line-height:1}.combo-btn .ph{color:var(--muted)}.cpop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:8;background:var(--bg);border:1.5px solid var(--line2);border-radius:14px;box-shadow:0 18px 40px rgba(16,40,28,.16);padding:10px;display:flex;flex-direction:column;gap:8px}.clist{max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:2px}.clist .grp{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:8px 8px 4px;text-transform:uppercase}.copt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;font-size:14.5px}.copt:hover,.copt.act{background:var(--soft)}.copt .fl{font-size:19px}.copt .cd{margin-left:auto;color:var(--muted);font-size:12px}.copt[aria-selected="true"]{font-weight:600;color:var(--accent)}.tray{border:1.5px solid var(--accent);background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.tray .hd{display:flex;align-items:center;gap:8px;font-size:14px}.tray .n{min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}.sel{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line2);font-size:13px}.sel small{color:var(--muted)}.sel button{border:0;background:none;cursor:pointer;color:var(--muted);display:inline-flex;padding:4px;border-radius:50%}.sel button:hover{background:var(--soft2);color:var(--fg)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bg2);font-size:13.5px;color:var(--muted)}
/* bienvenida */
.wel{max-width:680px;display:flex;flex-direction:column;gap:22px}
.wel h1{font-size:clamp(28px,4.4vw,40px);margin:0;letter-spacing:-.025em;line-height:1.15;font-weight:600;text-wrap:balance}
.wel p.lead{margin:0;font-size:17px;color:var(--muted);max-width:56ch}
.facts{display:flex;flex-direction:column;gap:10px}
.facts div{display:flex;gap:12px;align-items:center;font-size:15px}
.facts .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.draft{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--accent);border-radius:14px;background:var(--soft)}
/* resumen */
.sum{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:start}
.srow:last-child{border-bottom:0}
.srow .k{font-size:13px;color:var(--muted)}
.srow .v{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.srow .v.empty{color:var(--muted);font-style:italic}
@media (max-width:560px){.srow{grid-template-columns:1fr auto}.srow .k{grid-column:1/-1}}
/* ficha */
.ficha{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:18px}
.fhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.fhead h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.state{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.state select{border:1.5px solid var(--line2);border-radius:999px;padding:6px 12px;background:var(--soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.panel{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media (max-width:820px){.panel{grid-template-columns:1fr}}
.pc{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pc h2{margin:0;font-size:16px;font-weight:600}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:14px}
.kv .k{color:var(--muted)}
.act{display:flex;flex-direction:column;gap:10px;font-size:14px}
.act div{display:flex;gap:10px}
.act time{color:var(--muted);font-size:12.5px;width:84px;flex:none;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
@media (max-width:600px){.crumb,.saved{display:none!important}.logo svg{height:22px!important}.topin{gap:10px}.topin .link{margin-left:auto}}
</style>

function render(){
  const stage = $('#stage');
  $('#prog').hidden = st.step < 0 || st.created;
  $('#exitBtn').hidden = st.step < 0 || !!st.created;
  if (st.created) return renderFicha();
  if (st.step < 0) return renderWelcome();
  const L = steps();
  if (st.step >= L.length) return renderSummary();
  $('#progBar').style.width = Math.round((st.step) / (L.length + 1) * 100) + '%';
  const Q = L[st.step];
  $('#crumb').textContent = 'Mi espacio › Mis proyectos › ' + (st.v.nombre || 'Nuevo proyecto');
  stage.innerHTML = `<section class="q enter" aria-labelledby="qt">
    <div class="qnum">${st.step + 1} de ${L.length} <span class="sec">· ${esc(Q.sec)}</span></div>
    <h1 class="t" id="qt">${esc(Q.title)}${Q.req ? ' <span class="req" aria-label="obligatoria">*</span>' : ''}</h1>
    ${Q.help ? `<p class="help">${esc(Q.help)}</p>` : ''}
    <div id="field"></div>
    <div class="err" id="err" role="alert" hidden></div>
    <div class="foot">
      ${st.step > 0 ? `<button class="btn2" id="back" type="button">${svg('back',16)} Atrás</button>` : ''}

      <button class="btn" id="next" type="button">${st.step === L.length - 1 ? 'Ver resumen' : 'Continuar'} ${svg('arrow',16)}</button>
    </div>
    <span class="hint">Pulsa Intro ↵ para continuar</span>
  </section>`;
  FIELDS[Q.type](Q, $('#field'));
  $('#next').onclick = () => go(1, Q);
  if ($('#back')) $('#back').onclick = () => go(-1);
  if ($('#skip')) $('#skip').onclick = () => { delete st.v[Q.id]; go(1, Q, true); };
  const first = $('#field').querySelector('input:not([type=file]),textarea,select,button');
  if (first && Q.type !== 'tipo') first.focus({preventScroll:true});
}
function valid(Q){
  const v = st.v[Q.id];
  if (!Q.req) return '';
  if (Q.type === 'location') return v && v.pais ? '' : 'Elige el país.';
  if (Array.isArray(v)) return v.length ? '' : 'Elige al menos una opción.';
  return v && String(v).trim() ? '' : (Q.type === 'tipo' ? 'Elige un tipo de proyecto.' : 'Este dato es obligatorio.');
}
function go(d, Q, skip){
  if (d > 0 && Q && !skip){ const e = valid(Q); if (e){ const el = $('#err'); el.textContent = e; el.hidden = false; return; } }
  st.step = Math.max(0, st.step + d); save(); render(); window.scrollTo({top:0});
}
document.addEventListener('keydown', e => {
  if (st.step < 0 || st.created) return;
  const L = steps(); if (st.step >= L.length) return;
  if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); $('#next') && $('#next').click(); }
  if (/^[a-j]$/i.test(e.key) && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    const b = document.querySelector(`[data-key="${e.key.toUpperCase()}"]`); if (b) b.click();
  }
});

  }};

/* ---------- textos para resumen y ficha ---------- */
const descendants = id => { const out = []; const walk = (n, inside) => { const me = inside || n.id === id; if (me && n.id !== id) out.push(n.id); (n.categorias || n.subcategorias || []).forEach(c => walk(c, me)); }; ESPECIES.forEach(e => walk(e, false)); return out; };
const labelEsp = id => { for (const e of ESPECIES){ if (e.id===id) return e.label; for (const c of e.categorias||[]){ if (c.id===id) return c.label; for (const s of c.subcategorias||[]) if (s.id===id) return s.label; } } return id; };
const T = {
  tipo: () => { const t = TIPOS.find(x => x[0] === st.v.tipo); return t ? t[2] : ''; },
  lugar: () => { const l = st.v.lugar || {}; return [l.loc, l.region, l.pais].filter(Boolean).join(' · '); },
  especies: () => (st.v.especies || []).map(labelEsp).join(' · '),
  objetivos: () => (st.v.objetivos || []).join(' · '),
  productos: () => { const p = st.v.productos || {}; return [...(p.tipos||[]).map(k => k.split(':')[1]), ...(p.tableros||[]).map(id => TABLEROS.find(t=>t.id===id).name + ' (tablero)'), p.libre].filter(Boolean).join(' · '); },
  presu: () => { const p = st.v.presu; if (!p) return ''; if (p.nd) return 'Todavía no definido'; return (p.min||p.max) ? `${p.min||'—'} – ${p.max||'—'} ${p.mon}` : ''; },
  calendario: () => { const i = st.v.inicio || {}; return [st.v.fase, i.op === 'Fecha específica' ? i.fecha : i.op, st.v.finan ? 'Financiación: ' + st.v.finan : ''].filter(Boolean).join(' · '); },
  empresas: () => { const a = st.v.ayuda || {}; const s = (a.sel||[]).map(id => DIRECTORIO.find(d=>d.id===id).name); return [...(a.opts||[]), s.length ? 'Seleccionados: ' + s.join(', ') : ''].filter(Boolean).join(' · '); },
  docs: () => { const d = st.v.docs || {}; return [(d.files||[]).map(x=>x.name).join(', '), d.notas].filter(Boolean).join(' · '); }};
const idx = id => steps().findIndex(Q => Q.id === id);
const specificIdx = () => st.v.tipo ? idx(S[st.v.tipo][0].id) : idx('tipo');

function renderSummary(){
  $('#progBar').style.width = Math.round(steps().length / (steps().length + 1) * 100) + '%';
  const rows = [['Nombre del proyecto', st.v.nombre, 'nombre'],['Tipo de proyecto', T.tipo(), 'tipo'],['Especie', T.especies(), 'especies'],['Ubicación', T.lugar(), 'lugar'],['Objetivos', T.objetivos(), 'objetivos'],
    ['Detalles del proyecto', st.v.tipo ? S[st.v.tipo].filter(Q => st.v[Q.id]).length + ' de ' + S[st.v.tipo].length + ' preguntas respondidas' : '', null],
    ['Soluciones necesarias', T.productos(), 'productos'],['Presupuesto', T.presu(), 'presu'],['Calendario', T.calendario(), 'fase'],['Empresas y expertos', T.empresas(), 'ayuda'],['Documentación', T.docs(), 'docs'],['Privacidad', st.v.priv, 'priv']];
  $('#stage').innerHTML = `<section class="q enter" aria-labelledby="qt">
    <div class="qnum">Resumen</div><h1 class="t" id="qt">Revisa tu proyecto</h1>
    <p class="help">Puedes cambiar cualquier apartado. Crear el proyecto no lo publica ni envía nada.</p>
    <div class="sum">${rows.map(([k,val,id]) => `<div class="srow"><span class="k">${k}</span><span class="v ${val?'':'empty'}">${esc(val || 'Sin completar')}</span><button type="button" class="link" data-edit="${id ?? '__spec'}">Editar</button></div>`).join('')}</div>
    <div class="foot"><button class="btn2" id="back" type="button">${svg('back',16)} Atrás</button><span class="sp"></span><button class="btn2" id="draft" type="button">Guardar como borrador</button><button class="btn" id="create" type="button">Crear proyecto ${svg('arrow',16)}</button></div></section>`;
  $('#back').onclick = () => go(-1);
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { st.step = b.dataset.edit === '__spec' ? specificIdx() : idx(b.dataset.edit); save(); render(); });
  $('#draft').onclick = () => { save(); toast('Borrador guardado. Lo encontrarás en Mis proyectos › Borradores'); };
  $('#create').onclick = () => {
    if (!st.v.nombre || !st.v.tipo || !(st.v.lugar||{}).pais || !(st.v.especies||[]).length){ toast('Faltan datos obligatorios: nombre, tipo, país y especie'); return; }
    st.created = {at:new Date().toISOString(), estado:'Buscando soluciones', act:[['Ahora','Proyecto creado · privado']]}; st.tab = 'Resumen'; store.del(); render(); window.scrollTo({top:0}); };
}

function renderFicha(){
  const ESTADOS = ['Borrador','Buscando soluciones','Contactando proveedores','Evaluando propuestas','En ejecución','Finalizado'];
  $('#crumb').textContent = 'Mi espacio › Mis proyectos › ' + st.v.nombre; $('#saved').hidden = true;
  const TABS = ['Resumen','Soluciones','Empresas y expertos','Documentos','Actividad'];
  const a = st.v.ayuda || {opts:[], sel:[]};
  const p = st.v.productos || {tipos:[], tableros:[], libre:''};
  const panels = {
    'Resumen': `<div class="panel"><div class="pc"><h2>Datos del proyecto</h2><div class="kv">
        <span class="k">Tipo</span><span>${esc(T.tipo())}</span><span class="k">Especie</span><span>${esc(T.especies())}</span><span class="k">Ubicación</span><span>${esc(T.lugar())}</span>
        <span class="k">Objetivos</span><span>${esc(T.objetivos()) || '—'}</span><span class="k">Presupuesto</span><span>${esc(T.presu()) || '—'}</span><span class="k">Calendario</span><span>${esc(T.calendario()) || '—'}</span></div>
        ${st.v.descripcion ? `<p style="margin:4px 0 0;font-size:14px;color:var(--muted)">${esc(st.v.descripcion)}</p>` : ''}</div>
      <div class="pc"><h2>Siguiente paso</h2><span style="font-size:14px">Revisa las soluciones y elige a quién pedir información.</span><button class="btn" type="button" data-tab="Empresas y expertos">Ver empresas y expertos</button><span class="hint">${esc(st.v.priv)}</span></div></div>`,
    'Soluciones': `<div class="pc"><h2>Soluciones necesarias</h2>${p.tipos.length || p.tableros.length || p.libre ? `<div class="chips">${p.tipos.map(k => `<span class="chip" aria-pressed="true" style="cursor:default">${esc(k.split(':')[1])}</span>`).join('')}${p.tableros.map(id => `<span class="chip" style="cursor:default">${esc(TABLEROS.find(t=>t.id===id).name)} · tablero</span>`).join('')}</div>${p.libre?`<p style="margin:0;font-size:14px">${esc(p.libre)}</p>`:''}` : '<span class="hint">Aún no has añadido soluciones.</span>'}</div>`,
    'Empresas y expertos': `<div class="pc"><h2>Empresas y expertos</h2><span class="hint">No hemos contactado a nadie. Pulsa «Contactar» para enviar la solicitud a cada uno.</span>${a.sel.length ? a.sel.map(id => { const d = DIRECTORIO.find(x=>x.id===id); return `<div class="pick" style="cursor:default"><span class="av" style="background:${d.col};${d.k==='Experto'?'border-radius:50%':''}">${d.ini}</span><span style="flex:1;min-width:0"><strong style="font-size:14px">${esc(d.name)}</strong><small>${esc(d.sub)}</small></span><button class="btn2" type="button" data-contact="${d.id}" style="height:36px">Contactar</button></div>`; }).join('') : '<span class="hint">Todavía no has elegido empresas ni expertos.</span>'}</div>`,
    'Documentos': `<div class="pc"><h2>Documentos</h2>${(st.v.docs?.files||[]).length ? st.v.docs.files.map(x => `<div class="file">${svg('clip',15)}${esc(x.name)}</div>`).join('') : '<span class="hint">Sin documentos.</span>'}${st.v.docs?.notas ? `<p class="hint" style="margin:0">${esc(st.v.docs.notas)}</p>` : ''}</div>`,
    'Actividad': `<div class="pc"><h2>Actividad</h2><div class="act">${st.created.act.map(([t,x]) => `<div><time>${esc(t)}</time><span>${esc(x)}</span></div>`).join('')}</div></div>`};
  $('#stage').innerHTML = `<section class="ficha enter q" style="max-width:1000px">
    <div class="fhead"><div style="flex:1;min-width:0"><div class="qnum">Proyecto creado</div><h1>${esc(st.v.nombre)}</h1></div>
      <label class="state">Estado <select id="estado">${ESTADOS.map(e => `<option ${st.created.estado===e?'selected':''}>${e}</option>`).join('')}</select></label></div>
    <div class="tabs" role="tablist">${TABS.map(t => `<button type="button" role="tab" aria-selected="${st.tab===t}" data-tab="${t}">${t}</button>`).join('')}</div>
    <div role="tabpanel">${panels[st.tab]}</div>
    <div class="foot"><button class="link" id="again" type="button">Crear otro proyecto</button></div></section>`;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { st.tab = b.dataset.tab; renderFicha(); });
  $('#estado').onchange = e => { st.created.estado = e.target.value; st.created.act.unshift(['Ahora', 'Estado: ' + e.target.value]); toast('Estado actualizado'); };
  document.querySelectorAll('[data-contact]').forEach(b => b.onclick = () => { const d = DIRECTORIO.find(x=>x.id===b.dataset.contact); b.textContent = 'Solicitud preparada'; b.disabled = true; st.created.act.unshift(['Ahora', 'Solicitud preparada para ' + d.name]); toast('Solicitud preparada para ' + d.name + ' (prototipo: no se envía)'); });
  $('#again').onclick = () => { st = {step:-1, v:{}, created:null, tab:'Resumen'}; render(); };
}

function renderWelcome(){
  const d = store.get();
  $('#crumb').textContent = 'Mi espacio › Mis proyectos › Nuevo proyecto'; $('#saved').hidden = true;
  $('#stage').innerHTML = `<section class="wel q enter" aria-labelledby="wt">
    <div class="qnum">Nuevo proyecto</div>
    <h1 id="wt">Vamos a dar forma a tu proyecto</h1>
    <p class="lead">Cuéntanos qué necesitas y te ayudaremos a encontrar las soluciones, empresas y expertos adecuados.</p>
    <div class="facts"><div><span class="ic">${svg('clock',17)}</span>Tiempo estimado: 5–10 minutos</div><div><span class="ic">${svg('save',17)}</span>Puedes guardar y continuar más tarde</div><div><span class="ic">${svg('lock',17)}</span>Tu proyecto será privado inicialmente</div></div>
    ${d && d.v && d.v.nombre ? `<div class="draft"><span style="flex:1;min-width:0"><strong>Tienes un borrador: ${esc(d.v.nombre)}</strong><br><span class="hint">Guardado ${new Date(d.at).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></span><button class="btn" id="resume" type="button">Continuar ${svg('arrow',16)}</button></div>` : ''}
    <div class="foot" style="margin-top:0"><button class="btn" id="start" type="button">Crear mi proyecto ${svg('arrow',16)}</button><button class="link" id="example" type="button">Ver con un proyecto de ejemplo</button></div></section>`;
  $('#start').onclick = () => { st = {step:0, v:{}, created:null, tab:'Resumen'}; save(); render(); };
  $('#example').onclick = () => { st = {step:steps().length, v:JSON.parse(JSON.stringify(EXAMPLE)), created:null, tab:'Resumen'}; st.step = steps().length; save(); render(); toast('Proyecto de ejemplo cargado: estás en el resumen'); };
  if ($('#resume')) $('#resume').onclick = () => { st = {step:d.step ?? 0, v:d.v, created:null, tab:'Resumen'}; render(); };
}
$('#exitBtn').onclick = () => { save(); st.step = -1; render(); toast('Guardado. Puedes continuar cuando quieras.'); };
render();
</script>
