    (esp.length ? '<div class="tags">' + esp.map(e => '<span class="tag">' + esc(e) + '</span>').join('') + '</div>' : '') +
    keys.map(x => '<div class="kv"><span>' + esc(x.label) + '</span><span>' + esc(valorTxt(x, S.tec[x.id])) + '</span></div>').join('') +
    (S.paises.length ? '<div class="kv"><span>Mercados</span><span>' + S.paises.length + ' países</span></div>' : '') +
    '<span class="pcta">' + esc(a ? a.cta : 'Solicitar información') + ' →</span></div></div>';
}

// ---------- acciones ----------
function setCat(id) {
  if (S.cat && S.cat !== id) {
    const t2 = tpl(id), ids = t2 ? t2.atributos.map(a => a.id) : [];
    const pierde = Object.keys(S.tec).filter(k => lleno(S.tec[k]) && ids.indexOf(k) < 0);
    if (pierde.length) { UI.pend = id; render(); return; }
  }
  aplicaCat(id);
}
function aplicaCat(id) {
  const t2 = tpl(id), ids = t2 ? t2.atributos.map(a => a.id) : [];
  Object.keys(S.tec).forEach(k => { if (ids.indexOf(k) < 0) delete S.tec[k]; });
  S.cat = id; UI.pend = null; UI.q = '';
  if (!enfVis()) S.enf = [];
  guardar(); render();
}
const toggle = (arr, x) => { const i = arr.indexOf(x); i > -1 ? arr.splice(i, 1) : arr.push(x); };
const FICT = { ficha_tecnica: 'ficha_tecnica', sds: 'SDS', etiqueta: 'etiqueta', prospecto: 'prospecto', registro: 'registro', manual: 'manual', declaracion_ce: 'declaracion_CE', planos: 'planos', certificaciones: 'certificado', ensayos: 'ensayo', certificado_sanitario: 'cert_sanitario', catalogo_indices: 'indices', documentacion_api: 'API', rgpd: 'RGPD' };
function exportJSON() {
  const t = tplKey(S.cat), attrs = {};
  Object.keys(S.tec).forEach(k => { if (lleno(S.tec[k])) attrs['attr.' + t + '.' + k] = S.tec[k]; });
  return { category_id: S.cat, template: t, archetype: arqKey(S.cat), name: S.ident.nombre, brand: S.ident.marca, sku: S.ident.sku, manufacturer: S.ident.fabricante,
    short_description: S.ident.corta, description: S.ident.larga, objectives: S.ident.objetivos, languages: S.ident.idiomas,
    species: Object.keys(S.especies).map(k => ({ species: k, mode: S.especies[k].modo, items: S.especies[k].sel })), markets: S.paises.map(p => Object.assign({ country: p }, conRegistro() ? { registration: (S.registros[p] || {}).n || null, registration_status: (S.registros[p] || {}).e || 'En trámite' } : {})),
    attributes: attrs, custom_attributes: S.propios.filter(p => p.n), target_diseases: S.enf, variants: S.variantes.filter(v => Object.values(v).some(Boolean)),
    images: S.imgs, documents: Object.keys(S.docs).map(k => Object.assign({ type: k }, S.docs[k])), status: S.estado === 'En revisión' ? 'in_review' : 'draft' };
}
function modal(html) { document.getElementById('layer').innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="box">' + html + '</div></div>'; }
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const [act, x, y, z] = b.getAttribute('data-act').split('|');
  const P = pasos(), i = P.indexOf(pasoActual());
  switch (act) {
    case 'ir': ir(x); return;
    case 'atras': ir(P[i - 1].id); return;
    case 'seguir': UI.intento[S.paso] = 1; ir(P[i + 1].id); return;
    case 'fam': UI.fam = UI.fam === x ? null : x; render(); return;
    case 'cat': setCat(x); return;
    case 'pendok': aplicaCat(UI.pend); return;
    case 'pendno': UI.pend = null; render(); return;
    case 'esp': if (S.especies[x]) { delete S.especies[x]; if (UI.foco === x) UI.foco = null; } else { S.especies[x] = { modo: 'todas', sel: [] }; UI.foco = x; }
      S.enf = S.enf.filter(id => { const e = M.enfermedades.find(q => q.id === id); return e && e.especies.some(sp => S.especies[sp]); }); break;
    case 'espfoco': UI.foco = x; render(); return;
    case 'espmodo': S.especies[x] = { modo: y, sel: [] }; break;
    case 'espit': { const v = S.especies[x];
      if (v.modo === 'todas') { v.modo = 'excluir'; v.sel = [y]; }
      else { toggle(v.sel, y); if (y.indexOf(' › ') < 0) v.sel = v.sel.filter(q => q.indexOf(y + ' › ') !== 0); }
      break; }
    case 'reg': M.regiones[x].forEach(p => { if (S.paises.indexOf(p) < 0) S.paises.push(p); }); break;
    case 'pais': toggle(S.paises, x); UI.paisq = ''; break;
    case 'obj': toggle(S.ident.objetivos, x); break;
    case 'idi': toggle(S.ident.idiomas, x); break;
    case 'enum': S.tec[x] = S.tec[x] === y ? '' : y; break;
    case 'multi': if (!Array.isArray(S.tec[x])) S.tec[x] = []; toggle(S.tec[x], y); break;
    case 'bool': S.tec[x] = y === 'Sí'; break;
    case 'mark': if (y) S.tec[x] = y === 'na' ? { na: 1 } : { ni: 1 }; else delete S.tec[x]; break;
    case 'tfile': S.tec[x] = x + '.pdf'; break;
    case 'ppadd': S.propios.push({ n: '', v: '', u: '' }); break;
    case 'ppdel': S.propios.splice(+x, 1); break;
    case 'enf': toggle(S.enf, x); break;
    case 'varadd': S.variantes.push({}); break;
    case 'vardel': S.variantes.splice(+x, 1); break;
    case 'img': S.imgs = Math.min(12, S.imgs + 1); break;
    case 'imgdel': S.imgs = Math.max(0, S.imgs - 1); break;
    case 'doc': S.docs[x] = { n: (S.ident.sku || 'producto') + '_' + (FICT[x] || x) + '_ES.pdf', i: 'Español', v: x === 'sds' ? 'Usuarios registrados' : 'Público' }; break;
    case 'docdel': delete S.docs[x]; break;
    case 'borrador': guardar(); toast('Borrador guardado. Lo encontrarás en Catálogo › Borradores.'); return;
    case 'enviar': S.estado = 'En revisión'; guardar(); toast(regla('receta') ? 'Enviado. Agroolink lo revisa antes de publicarlo y te avisa.' : 'Enviado a revisión. Te avisamos cuando esté listo para publicar.'); render(); return;
    case 'json': modal('<strong>JSON del producto</strong><span class="hint">Contrato de ejemplo para desarrollo. Copia y pega donde lo necesites.</span><pre id="jsonout">' + esc(JSON.stringify(exportJSON(), null, 2)) + '</pre><div class="chips"><button type="button" class="btnp" data-act="copiar">Copiar</button><button type="button" class="btn" data-act="cerrar">Cerrar</button></div>'); return;
    case 'jsonin': modal('<strong>Importar JSON</strong><span class="hint">Pega un estado exportado de este asistente (Ver JSON no sirve: es el contrato, no el borrador).</span><textarea id="jsonin" aria-label="JSON del borrador">' + esc(JSON.stringify(S, null, 2)) + '</textarea><div class="chips"><button type="button" class="btnp" data-act="importar">Cargar</button><button type="button" class="btn" data-act="cerrar">Cerrar</button></div>'); return;
    case 'importar': try { S = Object.assign(nuevo(), JSON.parse(document.getElementById('jsonin').value)); document.getElementById('layer').innerHTML = ''; guardar(); render(); toast('Borrador cargado.'); } catch (e) { toast('Ese texto no es un JSON válido. Revisa que esté completo.'); } return;
    case 'copiar': { const txt = document.getElementById('jsonout').textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copiado.'), () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('jsonout')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecciona y copia con Ctrl+C.'); }); return; }
    case 'cerrar': document.getElementById('layer').innerHTML = ''; return;
  }
  guardar(); render();
});
document.addEventListener('input', ev => {
  const el = ev.target, d = el.dataset;
  if (el.id === 'q') { UI.q = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.id === 'paisq' || el.id === 'enfq') { UI[el.id] = el.value; const id = el.id, pos = el.selectionStart; render(); const n = document.getElementById(id); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (d.i) { S.ident[d.i] = el.value; if (d.i === 'corta') { const h = el.closest('.field').querySelector('.hint'); if (h) h.textContent = '· sale junto a las fotos · ' + el.value.length + ' / 300'; } }
  else if (d.t) S.tec[d.t] = el.value;
  else if (d.tv) { const o = S.tec[d.tv] && typeof S.tec[d.tv] === 'object' ? S.tec[d.tv] : {}; o.v = el.value; S.tec[d.tv] = o; }
  else if (d.tm) { const o = S.tec[d.tm] && typeof S.tec[d.tm] === 'object' ? S.tec[d.tm] : {}; o.m = el.value; S.tec[d.tm] = o; }
  else if (d.tr) { const [k, w] = d.tr.split('|'); const o = S.tec[k] && typeof S.tec[k] === 'object' ? S.tec[k] : {}; o[w] = el.value; S.tec[k] = o; }
  else if (d.pp) { const [k, w] = d.pp.split('|'); S.propios[+k][w] = el.value; }
  else if (d.var) { const [k, w] = d.var.split('|'); S.variantes[+k][w] = el.value; }
  else if (d.reg) { S.registros[d.reg] = Object.assign({ e: 'En trámite' }, S.registros[d.reg], { n: el.value }); }
  else return;
  pintaLado(); guardarLuego();
});
document.addEventListener('change', ev => {
  const el = ev.target, d = el.dataset;
  if (d.tu) { const o = S.tec[d.tu] && typeof S.tec[d.tu] === 'object' ? S.tec[d.tu] : {}; o.u = el.value; S.tec[d.tu] = o; }
  else if (d.rege) S.registros[d.rege] = Object.assign({ n: '' }, S.registros[d.rege], { e: el.value });
  else if (d.doci) S.docs[d.doci].i = el.value;
  else if (d.docv) S.docs[d.docv].v = el.value;
  else if (el.id === 'demoSel') { if (!el.value) return; S = el.value === 'cero' ? nuevo() : DEMOS[el.value](); UI.fam = null; UI.q = ''; UI.intento = {}; el.value = ''; guardar(); render(); toast(S.cat ? 'Ejemplo cargado: ' + (S.ident.nombre || '') + ' · datos de ejemplo' : 'Producto nuevo en blanco.'); return; }
  else if (d.tv || d.tr) { refrescaError((d.tv || d.tr.split('|')[0]), el); return; }
  else return;
  guardar(); pintaLado();
});
function refrescaError(id, el) {
  const a = (tpl(S.cat) || { atributos: [] }).atributos.find(x => x.id === id); if (!a) return;
  const f = el.closest('.field'), e = errorCampo(a, S.tec[id]);
  f.classList.toggle('bad', !!e);
  let t = f.querySelector('.errtxt');
  if (e) { if (!t) { t = document.createElement('span'); t.className = 'errtxt'; f.insertBefore(t, f.querySelector('.fx')); } t.textContent = e; } else if (t) t.remove();
}
document.getElementById('salir').addEventListener('click', () => { guardar(); toast('Borrador guardado. Puedes retomarlo desde Catálogo › Borradores.'); });
const h = (location.hash || '').slice(1);
if (h && M.pasos.some(p => p.id === h)) S.paso = h;
