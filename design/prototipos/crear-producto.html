<style>
/* Layout: barra superior fija · formulario 70 % + lateral 30 % (progreso, ayuda y vista previa) · una columna en móvil */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1319; --surface:#151D25; --surface2:#1A242E; --fg:#E5EBF0; --muted:#9BA7B2; --line:#25313C; --line2:#30404D;
  --accent:#86AEE0; --accent-ink:#0B1622; --soft:#1B2B3E; --soft2:#2A4466; --lila:#B3A7F2; --lime:#C6E05A;
  --ok:#7FD1A6; --ok-bg:#15291F; --warn:#F2C46B; --warn-bg:#2E2410; --err:#F19A8F; --err-bg:#341A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#151D25; --surface2:#1A242E; --fg:#E5EBF0; --muted:#9BA7B2; --line:#25313C; --line2:#30404D;
  --accent:#86AEE0; --accent-ink:#0B1622; --soft:#1B2B3E; --soft2:#2A4466; --lila:#B3A7F2; --lime:#C6E05A;
  --ok:#7FD1A6; --ok-bg:#15291F; --warn:#F2C46B; --warn-bg:#2E2410; --err:#F19A8F; --err-bg:#341A18; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:-.01em}.logo b{color:var(--accent)}
.crumb{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.demo select{height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 8px;font-size:12.5px}
.wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:22px;width:100%;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.side{order:-1}.side .help,.side .prevbox{display:none}.steps{flex-direction:row!important;overflow-x:auto;gap:6px!important}.steps button{white-space:nowrap}.steps .lbl2{display:none}}
.main{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}

<script>
(function(){
const M = JSON.parse(document.getElementById('modelo').textContent);
const KEY = 'agroolink-alta-producto-v4';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isNaN(n) ? null : n; };

// ---------- índice de la taxonomía ----------
const NOD = {}, HOJAS = [];
M.categorias.forEach(f => {
  NOD[f.id] = { id: f.id, label: f.label };
  f.grupos.forEach(g => {
    NOD[g.id] = { id: g.id, label: g.label, corto: g.corto };
    if (!g.tipos || !g.tipos.length) HOJAS.push(g.id);
    (g.tipos || []).forEach(t => { NOD[t.id] = { id: t.id, label: t.label, corto: t.corto }; HOJAS.push(t.id); });
    if (g.tipos && g.tipos.length) NOD[g.id + '-OTRO'] = { id: g.id + '-OTRO', label: 'Otro' };
  });
  NOD[f.id + '-OTRO'] = { id: f.id + '-OTRO', label: 'Otro' };
});
const esOtro = id => !!id && /-OTRO$/.test(id);
const ASIG = {}; Object.keys(M.plantillas).forEach(k => M.plantillas[k].nodos.forEach(n => ASIG[n] = k));
const up = id => { const o = []; let k = id; while (k) { o.push(k); k = k.indexOf('-') > -1 ? k.slice(0, k.lastIndexOf('-')) : null; } return o; };
const tplKey = id => { if (!id) return null; for (const k of up(id)) if (ASIG[k]) return ASIG[k]; return esOtro(id) ? 'otros' : null; };
const tpl = id => M.plantillas[tplKey(id)] || null;
const arqKey = id => { if (!id) return null; for (const k of up(id)) if (M.arquetipo_nodo[k]) return M.arquetipo_nodo[k]; return M.arquetipo_familia[id.slice(0, 3)]; };
const arq = id => M.arquetipos[arqKey(id)] || null;
const nombreCat = id => esOtro(id) ? 'Otro: ' + (S.catOtro && S.catOtro.trim() ? S.catOtro.trim() : '…') : (NOD[id] ? NOD[id].label : '');
const ruta = id => up(id).reverse().map(k => k === id ? nombreCat(k) : NOD[k] && NOD[k].label).filter(Boolean);
function regla(rid, id) {
  id = id || S.cat; const r = M.reglas.find(x => x.id === rid); if (!r || !id) return false; const c = r.cuando;
  if (c.siempre) return true;
  if (c.nodo) return c.nodo.indexOf(id) > -1;
  if (c.nodo_empieza) return c.nodo_empieza.some(p => id === p || id.indexOf(p + '-') === 0);
  if (c.arquetipo) return c.arquetipo.indexOf(arqKey(id)) > -1;
  return false;
}
const enfObl = () => regla('enfermedad_obligatoria');
const enfVis = () => enfObl() || regla('enfermedad_opcional');
const conRegistro = () => regla('registro_por_pais');

const cortoCat = id => NOD[id] ? (NOD[id].corto || NOD[id].label) : '';
const esTransversal = id => !!id && M.transversales.some(p => id === p || id.indexOf(p + '-') === 0);
const conAplicacion = id => !!id && M.aplicacion_familias.indexOf(id.slice(0, 3)) > -1;
function selSegs(sp) {
  const v = S.especies[sp], e = M.especies.find(x => x.label === sp); if (!v || !e) return [];
  const all = e.producciones.map(p => p.label);
  if (v.modo === 'todas') return all;
  if (v.modo === 'excluir') return all.filter(p => v.sel.indexOf(p) < 0);
  return all.filter(p => v.sel.some(x => x === p || x.indexOf(p + ' › ') === 0));
}
function pertinente(id) {
  let req = null; for (const k of up(id)) if (M.pertinencia[k]) { req = M.pertinencia[k]; break; }
  if (!req) return true;
  if (!Object.keys(S.especies).length && !S.sinEspecie) return true;
  return req.some(r => { const [sp, seg] = r.split(' › '); return !!S.especies[sp] && (!seg || selSegs(sp).indexOf(seg) > -1); });
}
function visibleAttr(a) {
  const w = a.visible_when; if (!w) return true;
  if (w.especies) return w.especies.some(sp => S.especies[sp]);
  if (w.segmentos) return Object.keys(S.especies).some(sp => selSegs(sp).some(x => w.segmentos.indexOf(x) > -1));
  return true;
}
const attrsTec = t => t ? t.atributos.filter(a => !(a.por_especie && conAplicacion(S.cat)) && visibleAttr(a)) : [];
const attrsApl = t => t && conAplicacion(S.cat) ? t.atributos.filter(a => a.por_especie) : [];
function ocultos() {   // datos guardados que ya no aplican: se conservan pero no se publican
  const vis = attrsTec(tpl(S.cat)).concat(attrsApl(tpl(S.cat))).map(a => a.id);
  return Object.keys(S.tec).filter(k => lleno(S.tec[k]) && vis.indexOf(k) < 0);
}
function destinos() {   // una tarjeta de aplicación por especie o por segmento elegido
  const out = [];
  Object.keys(S.especies).forEach(sp => {
    const v = S.especies[sp];
    if (sp === 'Otra especie') { out.push({ key: sp, sp: sp, seg: null, label: 'Otra especie: ' + ((v.texto || '').trim() || '…') }); return; }
