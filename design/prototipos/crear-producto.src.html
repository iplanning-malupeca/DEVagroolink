.blkh{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px}
@media (max-width:600px){.blkh{grid-template-columns:minmax(0,1fr) auto}.blkh .v{grid-column:1/-1;grid-row:2}}
.blkh .k{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.blkb{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px}
.savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 2px}
.diffl{display:flex;flex-direction:column;gap:6px;font-size:14px}
.diffl .old{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;max-width:720px;width:100%;max-height:90%;display:flex;flex-direction:column;gap:12px;padding:18px}
.modal pre,.modal textarea{margin:0;flex:1;min-height:240px;overflow:auto;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre;font-family:ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.fam{transition:border-color .12s,background .12s}}

<script>
(function(){

const esOtro = id => !!id && /-OTRO$/.test(id);

const up = id => { const o = []; let k = id; while (k) { o.push(k); k = k.indexOf('-') > -1 ? k.slice(0, k.lastIndexOf('-')) : null; } return o; };
const tplKey = id => { if (!id) return null; for (const k of up(id)) if (ASIG[k]) return ASIG[k]; return esOtro(id) ? 'otros' : null; };
const tpl = id => M.plantillas[tplKey(id)] || null;
const arqKey = id => { if (!id) return null; for (const k of up(id)) if (M.arquetipo_nodo[k]) return M.arquetipo_nodo[k]; return M.arquetipo_familia[id.slice(0, 3)]; };
const arq = id => M.arquetipos[arqKey(id)] || null;

const ruta = id => up(id).reverse().map(k => k === id ? nombreCat(k) : NOD[k] && NOD[k].label).filter(Boolean);
function regla(rid, id) {

const enfObl = () => regla('enfermedad_obligatoria');

const conRegistro = () => regla('registro_por_pais');

const cortoCat = id => NOD[id] ? (NOD[id].corto || NOD[id].label) : '';

// ---------- certificaciones ----------

const qEj = (location.search.match(/[?&]ejemplo=(\w+)/) || [])[1];
if (qEj && DEMOS[qEj]) S = DEMOS[qEj]();

if (/[?&]captura/.test(location.search)) window.__demo = v => { S = DEMOS[v] ? DEMOS[v]() : nuevo(); UI.vista = 'asistente'; UI.desdeRev = false; UI.fam = null; UI.q = ''; UI.intento = {}; UI.foco = null; guardar(); render(); };

if (!S.apl) S.apl = {};
if (!S.fotos) S.fotos = Array.from({ length: S.imgs || 0 }, (_, i) => ({ src: null, nombre: 'Foto ' + (i + 1) }));
if (!S.videos) S.videos = [];
if (!S.certs) S.certs = [];
delete S.imgs;
if (S.ident && S.ident.web === undefined) S.ident.web = '';
// especies: { Avicultura: { modo: 'todas' | 'excluir' | 'solo', sel: [...] } } (los borradores antiguos guardaban una lista)
if (!S.mercados) S.mercados = { entradas: (S.paises || []).map(p => ({ id: p, modo: 'toda', sel: [] })) };

Object.keys(S.especies || {}).forEach(k => { const v = S.especies[k]; if (Array.isArray(v)) S.especies[k] = v.length ? { modo: 'solo', sel: v } : { modo: 'todas', sel: [] }; });

function guardar() {
  S.guardado = new Date().toISOString();
  guardarSeguro();
  pintaGuardado();
}
function pintaGuardado() {
  const el = document.getElementById('saved');
  if (!S.guardado) { el.textContent = ''; return; }
  const d = new Date(S.guardado);
  el.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Guardado ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

let tGuardar = null;
const guardarLuego = () => { clearTimeout(tGuardar); tGuardar = setTimeout(guardar, 400); };
function toast(t) {
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}

// ---------- mercados: regiones (continentes) y países; todo · excluir · solo algunas ----------
const REG = M.regiones, REG_DE = {};
Object.keys(REG).forEach(r => REG[r].forEach(p => REG_DE[p] = r));
const MUNDO = 'Todo el mundo';

  const en = x => e.sel.indexOf(x) > -1;
  if (e.id === MUNDO) { if (e.modo === 'toda') return M.paises.slice(); if (e.modo === 'excluir') return M.paises.filter(p => !en(p) && !en(REG_DE[p])); return M.paises.filter(p => en(p) || en(REG_DE[p])); }

}

// ---------- pasos ----------
const pasos = () => M.pasos.filter(p => p.id === 'enfermedad' ? (S.cat && enfVis()) : p.id === 'variantes' ? !(S.cat && arqKey(S.cat) === 'servicio') : p.id === 'aplicaciones' ? (conAplicacion(S.cat) && Object.keys(S.especies).length > 0) : true);
const pasoActual = () => pasos().find(p => p.id === S.paso) || pasos()[0];
function ir(id) { S.visto[S.paso] = 1; S.paso = id; UI.pend = null; if (id === 'revision') UI.desdeRev = false; guardar(); render(); window.scrollTo({ top: 0 }); }

  if (typeof v === 'object') return !!(v.na || v.ni || String(v.v || '').trim() || String(v.min || '').trim() || String(v.max || '').trim());

}

function reducir(file) {   // miniatura de hasta 640 px para la vista previa; el original se subiría al servidor

    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res({ src: c.toDataURL('image/jpeg', .8), nombre: file.name, ancho: img.width }); }; img.onerror = () => res(null); img.src = r.result; }; r.onerror = () => res(null); r.readAsDataURL(file); });
}
async function anadirFotos(files) {

  let pequenas = 0;
  for (const f of lista) { const r = await reducir(f); if (r) { if (r.ancho < 1200) pequenas++; S.fotos.push({ src: r.src, nombre: r.nombre }); } }
  guardar(); render();
  if (pequenas) toast(pequenas + (pequenas === 1 ? ' foto mide' : ' fotos miden') + ' menos de 1.200 px: se verán pequeñas en la ficha.');
}
