<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agroolink · Alta de empresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Alta de empresa: un solo asistente que reúne 006–010. El formulario se adapta a cómo vende la empresa
   (distribuidores, comerciales, sucursales, sucursal de un grupo, distribuidor multimarca o servicios). Azul de empresa. Móvil primero. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#F7F9FC; --fg:#17231D; --muted:#56615B; --line:#E1E6EC; --line2:#D2DAE3;
  --accent:#1D4E89; --accent-ink:#FFFFFF; --soft:#E9F0F9; --soft2:#C8D8EE; --ok:#0E5A3A; --ok-bg:#EEF6EE; --warn:#7A4B00; --warn-bg:#FFF4E0; --lila:#4B3BA6; --lila-soft:#F1EEFB;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1319; --surface:#151D25; --surface2:#1A242E; --fg:#E5EBF0; --muted:#9BA7B2; --line:#25313C; --line2:#30404D;
  --accent:#86AEE0; --accent-ink:#0B1622; --soft:#1B2B3E; --soft2:#2A4466; --ok:#7FD1A6; --ok-bg:#15291F; --warn:#F2C46B; --warn-bg:#2E2410; --lila:#B3A7F2; --lila-soft:#2A2445; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#151D25; --surface2:#1A242E; --fg:#E5EBF0; --muted:#9BA7B2; --line:#25313C; --line2:#30404D;
  --accent:#86AEE0; --accent-ink:#0B1622; --soft:#1B2B3E; --soft2:#2A4466; --ok:#7FD1A6; --ok-bg:#15291F; --warn:#F2C46B; --warn-bg:#2E2410; --lila:#B3A7F2; --lila-soft:#2A2445; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px;padding-block:8px;padding-inline:max(clamp(16px,4vw,60px),env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;flex:none}.logo svg{height:28px;width:auto;display:block}
.rol{font-size:12px;font-weight:600;color:var(--accent);background:var(--soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.crumb{color:var(--muted);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb strong{color:var(--fg);font-weight:500}
.wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:24px;max-width:1500px;margin:0 auto;padding-block:20px 40px;padding-inline:max(clamp(16px,4vw,60px),env(safe-area-inset-left,0px))}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);padding-block:14px 32px}}
@media (max-width:600px){.crumb{display:none}.logo svg{height:22px}.top .btn{margin-left:auto}}
.main{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:600px){.main{padding:18px 16px;border-radius:16px}}
.eb{font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
h1{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
@media (max-width:600px){h1{font-size:21px}}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:68ch}
.steps{display:grid;gap:5px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.steps span{height:5px;border-radius:3px;background:var(--line2)}
.steps span.on{background:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.inp,.ta{height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:var(--surface);width:100%;min-width:0}
.ta{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
.inp.big{height:48px;border:1.5px solid var(--accent);font-size:16px;font-weight:500}
.code{display:flex;gap:8px}.code input{width:46px;height:54px;text-align:center;font-size:22px;font-weight:600;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:4px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.sm{min-height:30px;font-size:12.5px;padding:3px 11px}
.chip.soft.on{background:var(--soft);color:var(--accent);border-color:var(--soft2)}
.chip.ex.on{background:#FDECEA;color:#A3271B;border-color:transparent;text-decoration:line-through}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.opt.on{border:1.5px solid var(--accent);background:var(--soft)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.opt.on .rd{border-color:var(--accent)}.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt strong{display:block;font-size:15px}
.opt span.d{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.mcard{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.mcard.on{border:1.5px solid var(--accent);background:var(--soft)}
.logoE{width:44px;height:44px;border-radius:12px;color:#FFFFFF;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.tg{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tg.b{background:var(--soft);color:var(--accent)}.tg.ok{background:var(--ok-bg);color:var(--ok)}.tg.w{background:var(--warn-bg);color:var(--warn)}.tg.g{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.4}
.note strong{color:var(--fg)}
.note.w{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.note.w strong{color:inherit}
.dash{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed var(--accent);border-radius:14px;color:var(--accent);font-weight:600;background:var(--surface);width:100%;text-align:left}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.lrow .t{flex:1;min-width:0}
.lrow .t strong{display:block;font-size:14.5px}
.av{width:34px;height:34px;border-radius:50%;color:#FFFFFF;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.sw{display:flex;align-items:center;gap:10px;font-size:14px}
.sw input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none}
.nav{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
.nav .sp{flex:1}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btnp{height:42px;padding:0 20px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btnp:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:600px){.nav .btnp{flex:1;justify-content:center}}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.prev{display:flex;flex-direction:column;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 10px}
.pcta{height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sumrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
@media (max-width:600px){.sumrow{grid-template-columns:minmax(0,1fr) auto}.sumrow .v{grid-column:1/-1;grid-row:2}}
.sumrow .k{color:var(--muted)}
.ok-big{width:64px;height:64px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
</style>
</head>

    case 'crear': S.crear = true; S.crm = null; S.nueva.nombre = S.q; S.email = 'marta@' + (norm(S.q).replace(/[^a-z0-9]/g, '') || 'empresa') + '.com'; S.estatuto = 'independiente'; S.esp = {}; S.ramas = []; S.merc = []; break;
    case 'volverbuscar': S.crear = false; break;
    case 'reenviar': toast('Código reenviado.'); return;
    case 'aviso': toast('Enviado al superadmin. Te avisamos cuando lo cambie.'); return;
    case 'estatuto': S.estatuto = x; if (x !== 'sede' && S.venta === 'sucursales') S.venta = VENTA[S.actividad][0][0]; break;
    case 'actividad': S.actividad = x; S.venta = VENTA[x][0][0]; break;
    case 'venta': S.venta = x; S.destino = ''; break;
    case 'esp': if (S.esp[x]) { delete S.esp[x]; delete S.espModo[x]; } else { S.esp[x] = []; S.espModo[x] = 'todas'; } break;
    case 'espmodo': S.espModo[x] = y; S.esp[x] = []; break;
    case 'prod': toggle(S.esp[x], y); break;
    case 'rama': if (S.ramas.indexOf(x) > -1) { S.ramas = S.ramas.filter(r => r !== x); if (S.principal === x) S.principal = S.ramas[0] || null; } else { S.ramas.push(x); if (!S.principal) S.principal = x; } UI.rq = ''; break;
    case 'principal': S.principal = x; break;
    case 'merc': toggle(S.merc, x); UI.mq = ''; break;
    case 'obj': if (S.objetivos.indexOf(x) > -1) toggle(S.objetivos, x); else if (S.objetivos.length < 5) S.objetivos.push(x); else { toast('Máximo 5: quita uno antes.'); return; } break;
    case 'logo': S.logo = !S.logo; break;
    case 'invitar': if (UI.nuevaRed.trim()) { S.red.push(UI.nuevaRed.trim()); toast(modoRed() === 'marcas' ? 'Marca añadida: valida tus productos.' : 'Invitación enviada.'); UI.nuevaRed = ''; } break;
    case 'sincuenta': if (UI.nuevaRed.trim()) { S.red.push(UI.nuevaRed.trim() + ' (sin cuenta)'); toast('Perfil creado: le llegan las solicitudes por email.'); UI.nuevaRed = ''; } break;
    case 'destino': S.destino = x; break;
    case 'boton': toggle(S.botones, x); break;
    case 'publicar': S.publicado = true; toast('Ficha publicada.'); break;
    case 'salir': toast('Guardado. Puedes seguir desde tu panel de empresa.'); return;
  }
  render();
});
document.addEventListener('input', ev => {

  if (d.cd) { const a = S.codigo.split(''); while (a.length < 6) a.push(''); a[+d.cd] = el.value.slice(-1); S.codigo = a.join(''); const nx = document.querySelector('[data-cd="' + (+d.cd + 1) + '"]'); if (S.codigo.replace(/\s/g, '').length === 6 && !S.ok) { S.ok = true; render(); return; } if (nx && el.value) nx.focus(); }
});
document.addEventListener('change', ev => { const d = ev.target.dataset; if (d.sw) { S[d.sw] = ev.target.checked; lado(); } });
if (/[?&]captura/.test(location.search)) { window.__t = code => eval(code); }
